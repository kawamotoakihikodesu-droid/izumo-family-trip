<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>動画ガイド｜出雲・松江 2泊3日 家族旅（案内役：白うさぎの「むすび」）</title>
  <meta name="description" content="13歳の娘さんも楽しく見られる！白うさぎの「むすび」が案内する出雲・松江2泊3日家族旅行ガイド動画（8分40秒）。">
  <meta name="theme-color" content="#12233a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #0e1828;
      --bg-card: #16243b;
      --bg-card-hover: #1e3150;
      --accent-red: #dc4650;
      --accent-gold: #f5c85b;
      --text-main: #f4f7fb;
      --text-sub: #b8c6db;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #1b3152 0%, var(--bg-dark) 55%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 56px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(14, 24, 40, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      transition: background 0.2s;
    }
    .back-link:hover { background: rgba(255, 255, 255, 0.16); }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent-red), #eb6b56);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(220, 70, 80, 0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .share-btn:active { transform: scale(0.96); }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 24px 18px 0;
    }
    .hero-head {
      text-align: center;
      margin-bottom: 20px;
    }
    .pill {
      display: inline-block;
      background: rgba(245, 200, 91, 0.16);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 200, 91, 0.45);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.35rem, 4vw, 2.05rem);
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .lead {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .player-card {
      background: #050912;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(245, 200, 91, 0.32);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
      margin-bottom: 24px;
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .player-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--text-sub);
    }
    .player-meta strong { color: var(--accent-gold); }

    .chapters-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .chapters-header h2 {
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .chapters-header span {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .chapter-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.12s;
    }
    .chapter-btn:hover {
      background: var(--bg-card-hover);
      border-color: rgba(245, 200, 91, 0.45);
      transform: translateY(-1px);
    }
    .chapter-btn.active {
      background: rgba(220, 70, 80, 0.22);
      border-color: var(--accent-red);
      box-shadow: 0 0 0 1px rgba(220, 70, 80, 0.4);
    }
    .ch-time {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      background: rgba(245, 200, 91, 0.14);
      padding: 4px 8px;
      border-radius: 7px;
    }
    .ch-info { min-width: 0; }
    .ch-tag {
      font-size: 0.72rem;
      color: var(--text-sub);
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .ch-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-cta {
      margin-top: 30px;
      text-align: center;
    }
    .footer-cta a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }
    .footer-cta a:hover { background: rgba(255, 255, 255, 0.2); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1d9a6c;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="back-link">
        <i data-lucide="arrow-left" width="16" height="16"></i>
        旅のしおりへ戻る
      </a>
      <button class="share-btn" id="copyVideoUrlBtn">
        <i data-lucide="share-2" width="16" height="16"></i>
        動画URLをコピー
      </button>
    </div>
  </header>

  <main class="container">
    <div class="hero-head">
      <div class="pill">🐰 案内役：出雲の白うさぎ「むすび」｜全8分40秒</div>
      <h1>出雲・松江 2泊3日 家族旅 動画ガイド</h1>
      <p class="lead">2026年11月27日(金)〜29日(日)｜家族会議のポイントから3日間の見どころ・持ち物まで楽しくまとめました！</p>
    </div>

    <section class="player-card">
      <video id="guideVideo" controls playsinline preload="metadata" poster="video/poster.jpg">
        <source src="video/izumo_family_trip_guide.mp4" type="video/mp4">
        お使いのブラウザは動画再生に対応していません。
      </video>
      <div class="player-meta">
        <span>🔊 音声＆BGM付き（スマホはマナーモード解除で楽しめます）</span>
        <span>再生中: <strong id="nowPlayingLabel">01. オープニング</strong></span>
      </div>
    </section>

    <section>
      <div class="chapters-header">
        <h2><i data-lucide="list-video" width="20" height="20"></i> チャプター目次</h2>
        <span>タップで見たい場面へジャンプ！</span>
      </div>
      <div class="chapter-grid" id="chapterGrid"></div>
    </section>

    <div class="footer-cta">
      <a href="index.html">
        <i data-lucide="book-open" width="18" height="18"></i>
        詳しい旅程表・地図・持ち物チェックリストを見る
      </a>
    </div>
  </main>

  <div class="toast" id="toast">動画ページのURLをコピーしました！</div>

  <script>
    const CHAPTERS = [
      { time: 0.0, tag: "OPENING", title: "01. 神話の国・出雲＆松江 家族旅ガイド" },
      { time: 29.48, tag: "HOTEL", title: "02. お宿が最高！ドーミーイン出雲" },
      { time: 62.43, tag: "MAP", title: "03. 希望8スポットの位置関係マップ" },
      { time: 96.36, tag: "PLAN A vs B", title: "04. レンタカーあり？なし？徹底比較" },
      { time: 129.51, tag: "家族会議①", title: "05. 水木しげるロードを見送る理由" },
      { time: 163.58, tag: "家族会議②", title: "06. 大冒険！韓竈神社オプション" },
      { time: 199.05, tag: "DAY 1", title: "07. 1日目：到着＆出西くらしのvillage" },
      { time: 238.84, tag: "DAY 2 朝", title: "08. 2日目朝：稲佐の浜＆出雲大社" },
      { time: 272.71, tag: "DAY 2 昼", title: "09. リニューアル歴史博物館＆出雲そば" },
      { time: 311.10, tag: "DAY 2 午後①", title: "10. 江戸の町並み「木綿街道」散策" },
      { time: 345.93, tag: "DAY 2 午後②", title: "11. 国宝・松江城＆亀田山喫茶室" },
      { time: 381.19, tag: "DAY 2 夕方", title: "12. 宍道湖サンセット＆帰還" },
      { time: 412.75, tag: "DAY 3", title: "13. 3日目朝：万九千神社＆焼きたてパン" },
      { time: 450.39, tag: "CHECKLIST", title: "14. 出発前の持ち物チェックリスト" },
      { time: 487.46, tag: "ENDING", title: "15. さあ、家族会議をはじめよう！" }
    ];

    const video = document.getElementById("guideVideo");
    const grid = document.getElementById("chapterGrid");
    const nowPlaying = document.getElementById("nowPlayingLabel");

    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    const buttons = CHAPTERS.map((ch, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chapter-btn" + (idx === 0 ? " active" : "");
      btn.innerHTML = `
        <span class="ch-time">${fmtTime(ch.time)}</span>
        <span class="ch-info">
          <div class="ch-tag">${ch.tag}</div>
          <div class="ch-title">${ch.title}</div>
        </span>
      `;
      btn.addEventListener("click", () => {
        video.currentTime = ch.time;
        video.play().catch(() => {});
        video.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      grid.appendChild(btn);
      return btn;
    });

    video.addEventListener("timeupdate", () => {
      const t = video.currentTime;
      let activeIdx = 0;
      for (let i = 0; i < CHAPTERS.length; i++) {
        if (t >= CHAPTERS[i].time - 0.3) activeIdx = i;
      }
      buttons.forEach((b, i) => b.classList.toggle("active", i === activeIdx));
      nowPlaying.textContent = CHAPTERS[activeIdx].title;
    });

    document.getElementById("copyVideoUrlBtn").addEventListener("click", async () => {
      const url = "https://kawamotoakihikodesu-droid.github.io/izumo-family-trip/video.html";
      try {
        await navigator.clipboard.writeText(url);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    });

    lucide.createIcons();
  </script>
</body>
</html>
